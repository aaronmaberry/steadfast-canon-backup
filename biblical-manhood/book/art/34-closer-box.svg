<svg xmlns="http://www.w3.org/2000/svg" width="342.00pt" height="280.80pt" viewBox="0 0 1425 1170">
<defs>
<style type="text/css"><![CDATA[
@font-face { font-family: 'P052'; src: url('/usr/share/fonts/opentype/urw-base35/P052-Roman.otf'); }
@font-face { font-family: 'P052I'; src: url('/usr/share/fonts/opentype/urw-base35/P052-Italic.otf'); }
@font-face { font-family: 'C059B'; src: url('/usr/share/fonts/opentype/urw-base35/C059-Bold.otf'); }
]]></style></defs>
<rect width="1425" height="1170" fill="#F4EFE4"/>
<rect x="1" y="956" width="1423" height="212" fill="#ECE4D4"/>
<rect x="0.5" y="0.5" width="1424" height="1169" fill="none" stroke="#C4B8A8" stroke-width="1"/>
<rect x="42" y="33" width="3" height="1103" fill="#7A4A32"/>
<text x="92" y="97" font-family="P052" font-size="33" fill="#7A4A32">34</text>
<rect x="41" y="156" width="20" height="10" fill="#7A4A32"/>
<text x="92" y="171" font-family="C059B" font-size="33" fill="#7A4A32" letter-spacing="3.6">NAME IT</text>
<text x="92" y="233" font-family="P052" font-size="44" fill="#2C2924">What have you been giving to the windshield? What is still</text>
<text x="92" y="290" font-family="P052" font-size="44" fill="#2C2924">blank on the table?</text>
<line x1="92" y1="350" x2="1350" y2="350" stroke="#C4B8A8" stroke-width="1"/>
<rect x="41" y="418" width="20" height="10" fill="#7A4A32"/>
<text x="92" y="433" font-family="C059B" font-size="33" fill="#7A4A32" letter-spacing="3.6">DO THIS WEEK</text>
<text x="92" y="495" font-family="P052" font-size="44" fill="#2C2924">Sit down. One course. One step with a day on it. Ink.</text>
<text x="92" y="590" font-family="P052I" font-size="44" fill="#5A544C">The course I wrote, and the step this week:</text>
<line x1="92" y1="642" x2="1350" y2="642" stroke="#C4B8A8" stroke-width="1"/>
<rect x="41" y="789" width="20" height="10" fill="#7A4A32"/>
<text x="92" y="804" font-family="C059B" font-size="33" fill="#7A4A32" letter-spacing="3.6">TELL A BROTHER</text>
<text x="92" y="866" font-family="P052" font-size="44" fill="#2C2924">Show him the page. Have him ask if the step happened.</text>
<line x1="92" y1="926" x2="1350" y2="926" stroke="#C4B8A8" stroke-width="1"/>
<rect x="41" y="994" width="20" height="10" fill="#7A4A32"/>
<text x="92" y="1009" font-family="C059B" font-size="33" fill="#7A4A32" letter-spacing="3.6">CARRY THIS</text>
<text x="92" y="1079" font-family="P052I" font-size="54" fill="#2C2924">Write the next move. Ink, not the windshield.</text>
</svg>